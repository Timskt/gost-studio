name: upstream compatibility check

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:gost
      - name: Open a reviewable update PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh GOST upstream compatibility lock'
          title: 'chore: refresh GOST upstream compatibility lock'
          body: |
            Automated compatibility lock refresh for `go-gost/gost` and `go-gost/x`.

            Please review the upstream commits before merging and rebuild packaged runtimes as needed.
          branch: automation/gost-upstream-sync
          delete-branch: true
