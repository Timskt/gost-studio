name: verify

# Deliberately manual: local checks run on every development iteration and
# GitHub Actions runs only at a reviewable milestone to conserve minutes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Verification target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - e2e
          - rust

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ inputs.target == 'all' || inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test -- --run
      - run: pnpm build

  rust:
    if: ${{ inputs.target == 'all' || inputs.target == 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo check --manifest-path src-tauri/Cargo.toml


  e2e:
    if: ${{ inputs.target == 'all' || inputs.target == 'e2e' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
